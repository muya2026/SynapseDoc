<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynapseDoc // Markdown Neural Mapper</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-[#050811] text-white overflow-hidden">
    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 p-4 text-center pointer-events-none">
        <h1 class="text-3xl font-bold tracking-wider cyberpunk-text">
            SynapseDoc <span class="text-[#00f3ff]">//</span> Markdown Neural Mapper
        </h1>
    </header>

    <!-- BCI HUD Display -->
    <div id="bci-hud" class="fixed top-20 right-4 z-50 w-80 opacity-0 transition-opacity duration-300 pointer-events-none">
        <div class="glass-panel p-4 border-l-4 border-[#00f3ff]">
            <div class="flex items-center gap-2 mb-2">
                <div class="w-3 h-3 bg-[#00f3ff] rounded-full animate-pulse"></div>
                <span class="text-xs text-[#00f3ff] uppercase tracking-widest">BCI Data Stream</span>
            </div>
            <div id="bci-content" class="text-sm text-gray-200 font-mono"></div>
        </div>
    </div>

    <!-- Left Control Drawer -->
    <div class="fixed left-4 top-20 z-40 w-96 max-h-[calc(100vh-140px)] glass-panel overflow-y-auto">
        <div class="p-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-[#00f3ff]">Neural Input</h2>
                <button id="toggle-drawer" class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
            </div>
            
            <div id="drawer-content">
                <!-- Preset Selector -->
                <div class="mb-4">
                    <label class="block text-xs text-gray-400 mb-2 uppercase tracking-wider">Load Preset</label>
                    <select id="preset-selector" class="w-full bg-[#0a0f1e] border border-[#00f3ff]/30 rounded px-3 py-2 text-sm focus:outline-none focus:border-[#00f3ff]">
                        <option value="">-- Select Preset --</option>
                        <option value="api">API Specification</option>
                        <option value="roadmap">Project Roadmap</option>
                        <option value="architecture">System Architecture</option>
                    </select>
                </div>

                <!-- Markdown Textarea -->
                <div class="mb-4">
                    <label class="block text-xs text-gray-400 mb-2 uppercase tracking-wider">Markdown Input</label>
                    <textarea id="markdown-input" class="w-full h-48 bg-[#0a0f1e] border border-[#00f3ff]/30 rounded px-3 py-2 text-sm font-mono focus:outline-none focus:border-[#00f3ff] resize-none" placeholder="Paste your Markdown here..."></textarea>
                </div>

                <!-- Action Buttons -->
                <div class="space-y-2">
                    <button id="parse-btn" class="w-full btn-neon py-2 px-4 text-sm">
                        Parse to Neural Map
                    </button>
                    <button id="export-btn" class="w-full btn-secondary py-2 px-4 text-sm">
                        Export Standalone HTML
                    </button>
                    <button id="embed-btn" class="w-full btn-secondary py-2 px-4 text-sm">
                        Generate Embed Code
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="w-full h-screen"></div>

    <!-- Bottom Right Controls Legend -->
    <div class="fixed bottom-4 right-4 z-40 glass-panel p-4">
        <h3 class="text-xs text-[#00f3ff] uppercase tracking-widest mb-3">Control Matrix</h3>
        <div class="space-y-2 text-xs text-gray-400">
            <div class="flex items-center gap-2">
                <kbd class="px-2 py-1 bg-[#0a0f1e] rounded border border-[#00f3ff]/30">LMB + Drag</kbd>
                <span>Rotate View</span>
            </div>
            <div class="flex items-center gap-2">
                <kbd class="px-2 py-1 bg-[#0a0f1e] rounded border border-[#00f3ff]/30">Scroll</kbd>
                <span>Zoom</span>
            </div>
            <div class="flex items-center gap-2">
                <kbd class="px-2 py-1 bg-[#0a0f1e] rounded border border-[#00f3ff]/30">RMB + Drag</kbd>
                <span>Pan</span>
            </div>
            <div class="flex items-center gap-2">
                <kbd class="px-2 py-1 bg-[#0a0f1e] rounded border border-[#00f3ff]/30">Hover</kbd>
                <span>Node Select</span>
            </div>
        </div>
        
        <div class="mt-4 pt-4 border-t border-[#00f3ff]/20 text-xs text-gray-500">
            <p>Built with Three.js + Marked.js</p>
            <p class="mt-1">SynapseDoc v1.0</p>
        </div>
    </div>

    <!-- Export Modal -->
    <div id="export-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center">
        <div class="glass-panel p-6 w-full max-w-2xl mx-4">
            <div class="flex items-center justify-between mb-4">
                <h3 id="modal-title" class="text-xl font-semibold text-[#00f3ff]">Export Options</h3>
                <button id="close-modal" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div id="modal-content" class="space-y-4">
                <textarea id="export-output" class="w-full h-64 bg-[#0a0f1e] border border-[#00f3ff]/30 rounded px-3 py-2 text-xs font-mono focus:outline-none focus:border-[#00f3ff]" readonly></textarea>
                <button id="copy-export" class="btn-neon py-2 px-4 text-sm">Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./assets/js/parser.js"></script>
    <script src="./assets/js/graph3d.js"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
